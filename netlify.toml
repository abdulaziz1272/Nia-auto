
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# API so'rovlarini Render serveriga yuborish
[[redirects]]
  from = "/api/*"
  to = "https://nia-auto-api.onrender.com/api/:splat"
  status = 200
  force = true

# Vue sahifalari uchun
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
